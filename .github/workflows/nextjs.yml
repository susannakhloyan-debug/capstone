<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One-Pager</title>
<style>
  :root {
    --accent: #1E8A4C;
    --accent-2: #F2C230;
    --ink: #14161A;
    --ink-soft: #5B6270;
    --line: #E6E8EC;
    --bg: #F2F3F5;
    --card: #FFFFFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .sheet {
    width: 100%;
    max-width: 980px;
    background: var(--card);
    border-radius: 16px;
    padding: 32px 40px 30px;
    box-shadow: 0 1px 2px rgba(20,22,26,0.04), 0 20px 40px rgba(20,22,26,0.08);
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
  }

  .title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.15;
  }

  .subtitle {
    margin-top: 4px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .status-badge {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 20px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
    color: #fff;
  }

  .status-badge.on-track {
    background: var(--accent-2);
    color: var(--ink);
  }

  .status-badge.at-risk {
    background: var(--ink);
    color: #fff;
  }

  .status-dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: currentColor;
  }

  /* ---------- Numbers ---------- */
  .numbers {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 16px;
    position: relative;
    overflow: hidden;
  }

  .stat-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 3px;
    background: var(--accent);
  }

  .stat-value {
    font-size: 32px;
    font-weight: 800;
    color: var(--ink);
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .stat-label {
    margin-top: 6px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  /* ---------- Sections ---------- */
  .section-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    margin-bottom: 6px;
  }

  .decision {
    background: var(--ink);
    color: #fff;
    border-radius: 12px;
    padding: 16px 20px;
  }

  .decision .section-label {
    color: #ffffffb3;
  }

  .decision-text {
    font-size: 16px;
    font-weight: 600;
    line-height: 1.4;
  }

  .steps {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .step-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .step-number {
    min-width: 30px;
    height: 24px;
    padding: 0 8px;
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
    align-self: flex-start;
  }

  .step-text {
    font-size: 13.5px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--ink);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--ink-soft);
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  /* ---------- Print ---------- */
  @page {
    size: A4;
    margin: 12mm;
  }

  @media print {
    body {
      background: #fff;
      padding: 0;
      display: block;
    }
    .sheet {
      box-shadow: none;
      border-radius: 0;
      max-width: 100%;
      padding: 6mm 4mm;
      gap: 18px;
    }
    .stat-card, .step-card {
      break-inside: avoid;
    }
  }
</style>
</head>
<body>

  <div class="sheet">

    <!-- Header -->
    <div class="header">
      <div>
        <div class="title">Bridgeline — Business Analysis Consultation Sales Platform</div>
        <div class="subtitle">Capstone Project · Session 8 Demo</div>
      </div>
      <div class="status-badge on-track">
        <span class="status-dot"></span>
        On track
      </div>
      <!-- Swap class above to "at-risk" and label to "At risk" if needed -->
    </div>

    <!-- 3 Numbers -->
    <div class="numbers">
      <div class="stat-card">
        <div class="stat-value">115K+</div>
        <div class="stat-label">SMEs in Armenia — total addressable market (99.8% of all businesses)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">5 days</div>
        <div class="stat-label">Strict SLA: application received → scoped proposal sent</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">8</div>
        <div class="stat-label">Pilot companies targeted for first paid proposals</div>
      </div>
    </div>

    <!-- Decision / Ask -->
    <div class="decision">
      <div class="section-label">Decision / Ask</div>
      <div class="decision-text">
        Approve the funnel: application → 5-day scoped proposal → delivery by a 4-person pilot team (BA, PM, Designer, Tech Feasibility Lead) → payment on completion. Need sign-off to start building intake and hiring the pilot team.
      </div>
    </div>

    <!-- Next 3 Steps -->
    <div>
      <div class="section-label" style="color: var(--ink-soft);">Next 3 Sessions — My Actions</div>
      <div class="steps">
        <div class="step-card">
          <div class="step-number">S6</div>
          <div class="step-text">Finalize the PRD, 5-day scoping workflow, and proposal template — validate scope with the BA, PM, Designer, and Tech Feasibility Lead.</div>
        </div>
        <div class="step-card">
          <div class="step-number">S7</div>
          <div class="step-text">Build and connect the live site — application intake, scoping dashboard, proposal delivery — and shortlist the 8 pilot SMEs to apply.</div>
        </div>
        <div class="step-card">
          <div class="step-number">S8</div>
          <div class="step-text">Run one full pilot cycle live — application in, scoped proposal out — and present the working site as the capstone demo.</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <span>Prepared by Susanna · SME data: ArmBanks, 2026</span>
      <span>Updated: 17 Aug 2026</span>
    </div>

  </div>

</body>
</html>
